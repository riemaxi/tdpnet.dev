[package]
name = "pingpong"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"

# Pin idna_adapter to avoid 1.2.2 (which requires Rust 2024 Edition)
idna_adapter = "=1.2.0"